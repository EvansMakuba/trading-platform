<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Confluence Trader - Rise / Fall</title>
    <!-- TradingView Lightweight Charts Library -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #131722; color: #d1d4dc; display: flex; height: 100vh; overflow: hidden; }
        
        /* Left: Main Chart Area */
        #chart-container { flex: 1; height: 100%; position: relative; border-right: 1px solid #2a2e39; }
        #chart-header { position: absolute; top: 15px; left: 20px; z-index: 10; font-size: 18px; font-weight: bold; color: #fff; background: rgba(19, 23, 34, 0.8); padding: 5px 10px; border-radius: 4px; }
        
        /* Right: Trading Panel */
        #panel { width: 320px; padding: 20px; display: flex; flex-direction: column; gap: 15px; background: #1e222d; }
        h3 { font-size: 16px; color: #fff; border-bottom: 1px solid #2a2e39; padding-bottom: 10px; }
        
        label { font-size: 12px; color: #787b86; text-transform: uppercase; font-weight: bold; }
        input, select { width: 100%; background: #131722; border: 1px solid #2a2e39; color: #fff; padding: 10px; border-radius: 4px; font-size: 14px; margin-top: 5px; }
        
        .btn-group { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: #fff; }
        .btn-rise { background: #00c853; }
        .btn-fall { background: #ff3b30; }
        .btn-arm { background: #2962ff; width: 100%; padding: 14px; margin-top: 10px; }
        
        #log { background: #131722; border: 1px solid #2a2e39; color: #00e676; font-family: monospace; font-size: 11px; padding: 10px; height: 150px; overflow-y: auto; border-radius: 4px; }
    </style>
</head>
<body>

    <!-- Left: Live TradingView Chart -->
    <div id="chart-container">
        <div id="chart-header">Volatility 25 Index (15m)</div>
    </div>

    <!-- Right: Deriv Controls -->
    <div id="panel">
        <h3>Rise / Fall Auto-Trader</h3>

        <div>
            <label>Deriv API Token</label>
            <input type="password" id="api_token" placeholder="Paste Read/Trade Token">
        </div>

        <div>
            <label>Wave Bias</label>
            <select id="wave_bias">
                <option value="RISE">Bullish (Only Take RISE on Green Arrow)</option>
                <option value="FALL">Bearish (Only Take FALL on Red Arrow)</option>
            </select>
        </div>

        <div>
            <label>Duration</label>
            <select id="duration">
                <option value="5t">5 Ticks</option>
                <option value="1m">1 Minute</option>
                <option value="5m">5 Minutes</option>
                <option value="15m">15 Minutes</option>
            </select>
        </div>

        <div>
            <label>Stake (USD)</label>
            <input type="number" id="stake" value="10" min="1">
        </div>

        <button class="btn btn-arm" onclick="armBot()">⚡ ARM AUTO-SYSTEM</button>

        <label>System Telemetry</label>
        <div id="log">Connecting to Deriv data stream...<br></div>
    </div>

    <script>
        const logBox = document.getElementById('log');
        function log(msg) {
            logBox.innerHTML += `[${new Date().toLocaleTimeString()}] ${msg}<br>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        // 1. Initialize TradingView Chart
        const chartContainer = document.getElementById('chart-container');
        const chart = LightweightCharts.createChart(chartContainer, {
            layout: { background: { color: '#131722' }, textColor: '#d1d4dc' },
            grid: { vertLines: { color: '#2a2e39' }, horzLines: { color: '#2a2e39' } },
            timeScale: { timeVisible: true, secondsVisible: false }
        });

        const candleSeries = chart.addCandlestickSeries({
            upColor: '#00c853', downColor: '#ff3b30',
            borderVisible: false,
            wickUpColor: '#00c853', wickDownColor: '#ff3b30'
        });

        // Resize chart dynamically
        window.addEventListener('resize', () => {
            chart.applyOptions({ width: chartContainer.clientWidth, height: chartContainer.clientHeight });
        });
        chart.applyOptions({ width: chartContainer.clientWidth, height: chartContainer.clientHeight });

        // 2. Connect to Deriv Public WebSocket for Live Data
        const ws = new WebSocket('wss://ws.binaryws.com/websockets/v3?app_id=1089');

        ws.onopen = () => {
            log("Connected to Deriv Market Stream.");
            // Request past 300 candles of Volatility 25 (15-min bars = 900 seconds)
            ws.send(JSON.stringify({
                ticks_history: "R_25",
                adjust_start_time: 1,
                count: 300,
                end: "latest",
                style: "candles",
                granularity: 900,
                subscribe: 1
            }));
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);

            // Historical Bars Loaded
            if (data.candles) {
                const formatted = data.candles.map(c => ({
                    time: c.epoch,
                    open: c.open,
                    high: c.high,
                    low: c.low,
                    close: c.close
                }));
                candleSeries.setData(formatted);
                log("Loaded historical candles.");
            }

            // Real-Time Tick Update
            if (data.ohlc) {
                const c = data.ohlc;
                candleSeries.update({
                    time: c.open_time,
                    open: parseFloat(c.open),
                    high: parseFloat(c.high),
                    low: parseFloat(c.low),
                    close: parseFloat(c.close)
                });
            }
        };

        // 3. ARM Bot Handler
        async function armBot() {
            const token = document.getElementById('api_token').value;
            const bias = document.getElementById('wave_bias').value;
            const stake = document.getElementById('stake').value;
            const duration = document.getElementById('duration').value;

            if(!token) return alert("Please enter your Deriv API token!");

            log(`Arming system: Bias = ${bias}, Stake = $${stake}`);
            
            const res = await fetch('/api/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, wave_count: bias, stake, duration })
            });
            const result = await res.json();
            log(result.message);
        }
    </script>
</body>
</html>
